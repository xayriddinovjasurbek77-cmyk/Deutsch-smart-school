    <script>
      // In preview environments, suppress unhandled WebSocket connection errors from @vite/client
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        if (reason && (
          (reason.message && (reason.message.indexOf('WebSocket') !== -1 || reason.message.indexOf('ws') !== -1)) ||
          (reason.stack && reason.stack.indexOf('@vite/client') !== -1)
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && (
          (event.filename && event.filename.indexOf('@vite/client') !== -1) ||
          (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('ws') !== -1))
        )) {
          event.preventDefault();
        }
      });
